[project]
name = "cad-agent"
version = "0.1.0"
description = "CAD 图纸助手第一阶段原型"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "aiosqlite>=0.21,<1",
  "ezdxf==1.4.4", "shapely>=2.0,<3", "matplotlib>=3.9,<4", "pillow>=11,<13",
  "mcp[cli]>=2,<3", "python-dotenv>=1.0,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
